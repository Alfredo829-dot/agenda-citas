  if (!file || !/^image\//.test(file.type)){ toast('Elige una imagen (JPG o PNG).', { type:'err' }); return; }
  if (file.size > 8 * 1024 * 1024){ toast('La imagen pesa demasiado (máx. 8 MB).', { type:'err' }); return; }
  const url = URL.createObjectURL(file);
  try {
    const img = await cargarImg(url);
    const k = Math.min(1, 320 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let out = cv.toDataURL('image/png');
    if (out.length > 180000) out = cv.toDataURL('image/jpeg', 0.85);
    data.negocio.logo = out;
    if (save()){ actualizarIconos(); render(); toast('Logo guardado ✓'); }
  } catch (e) { toast('No se pudo leer la imagen.', { type:'err' }); }
  finally { URL.revokeObjectURL(url); }
}

/* =========================================================
   ACCIONES (delegación de eventos)
   ========================================================= */
const actions = {
  'nav': el => { state.view = el.dataset.view; if (state.view === 'agenda') state.scrollNow = true; closeSheet(); render(); window.scrollTo(0, state.view === 'agenda' ? window.scrollY : 0); if (state.view !== 'agenda') window.scrollTo(0, 0); },
  'theme': () => { const dark = document.documentElement.dataset.theme === 'dark'; data.ajustes.tema = dark ? 'claro' : 'oscuro'; save(); render(); },
  'tema': el => { data.ajustes.tema = el.dataset.tema; save(); render(); },
  'motor': () => openMotor(),
  'close-sheet': () => closeSheet(),
  'onb-tipo': el => { state.onbTipo = el.dataset.tipo; $$('.type').forEach(b => b.classList.toggle('on', b === el)); },
  'demo': () => { cargarDemo(); state.view = 'hoy'; render(); window.scrollTo(0, 0); toast('Datos de ejemplo cargados. Bórralos en Ajustes cuando quieras.', { ms:4500 }); },
  'nueva-cita': el => openCitaForm({}, el.dataset.fecha ? { fecha: el.dataset.fecha } : (state.view === 'agenda' ? { fecha: state.fecha } : { fecha: today() })),
  'ver-cita': el => openCitaDetalle(el.dataset.id),
  'editar-cita': el => { const c = getCita(el.dataset.id); if (c) openCitaForm(c); },
  'cita-borrar': async el => {
    const c = getCita(el.dataset.id); if (!c) return;
    if (!await confirmDialog('¿Eliminar esta cita?', 'Se borrará para siempre. Si solo no va a venir, mejor usa “Cancelar cita” para conservar el historial.', { ok:'Eliminar', danger:true })) return;
    data.citas = data.citas.filter(x => x.id !== c.id); save(); closeSheet(); render();
    toast('Cita eliminada', { action:'Deshacer', onAction: () => { data.citas.push(c); save(); render(); } });
  },
  'estado': el => setEstado(el.dataset.id, el.dataset.estado),
  'wa-sent': el => {
    const { id, tipo } = el.dataset, prev = marcarEnviado(id, tipo, true), wasOpen = sheetOpen();
    toast(`${TIPOS[tipo].label} marcado como enviado`, { action:'Deshacer', onAction: () => { const c = getCita(id); c.recordatorios[tipo] = prev; save(); render(); if (sheetOpen()) openCitaDetalle(id); } });
    setTimeout(() => { render(); if (wasOpen) openCitaDetalle(id); }, 400);
    return 'keep-default';
  },
  'copiar': async el => {
    const c = getCita(el.dataset.id); if (!c) return;
    const ok = await copiarTexto(mensaje(c, el.dataset.tipo));
    toast(ok ? 'Mensaje copiado ✓ Pégalo donde quieras.' : 'No se pudo copiar en este navegador.', { type: ok ? 'ok' : 'err' });
  },
  'wa-toggle': el => { const c = getCita(el.dataset.id); if (!c) return; marcarEnviado(c.id, el.dataset.tipo, !(c.recordatorios || {})[el.dataset.tipo]); render(); openCitaDetalle(c.id); },
  'ticket-bt': el => { const c = getCita(el.dataset.id); if (c) imprimirBT(c); },
  'ticket-print': el => { const c = getCita(el.dataset.id); if (c) imprimirHTML(ticketHTML(c), 'size:58mm auto;margin:0'); },
  'bt-conectar': async () => { try { await btConectar(false); toast('Impresora conectada ✓'); } catch (e) { toast(btErrorAmigable(e), { type:'err', ms:6000 }); } },
  'bt-todos': async () => { try { await btConectar(true); toast('Impresora conectada ✓'); } catch (e) { toast(btErrorAmigable(e), { type:'err', ms:6000 }); } },
  'bt-prueba': () => imprimirBT(citaEjemplo()),
  'print-prueba': () => imprimirHTML(ticketHTML(citaEjemplo()), 'size:58mm auto;margin:0'),
  'imprimir-dia': () => {
    const f = state.fecha, cs = citasDe(f).filter(c => c.estado !== 'cancelada');
    imprimirHTML(`<div class="dayprint"><h1>${esc(data.negocio.nombre || 'Agenda')} · ${esc(cap(fmtFecha(f)))}</h1><div>${cs.length} citas</div><table><tr><th>Hora</th><th>Cliente</th><th>Teléfono</th><th>Servicio</th><th>Precio</th><th>Anticipo</th><th>Notas</th></tr>${cs.map(c => `<tr><td>${esc(fmtHora(c.hora))}</td><td>${esc(c.cliente)}</td><td>${esc(fmtTel(c.telefono))}</td><td>${esc(c.servicioNombre)}</td><td>${money(c.precio)}</td><td>${c.anticipo ? money(c.anticipoMonto) : '—'}</td><td>${esc(c.notas)}</td></tr>`).join('')}</table></div>`, 'size:auto;margin:12mm');
  },
  'modo': el => { state.modo = el.dataset.modo; state.scrollNow = true; render(); },
  'fecha-mover': el => { state.fecha = addDays(state.fecha, Number(el.dataset.d) * (state.modo === 'dia' ? 1 : 7)); render(); },
  'fecha-hoy': () => { state.fecha = today(); state.scrollNow = true; render(); },
  'ir-dia': el => { state.fecha = el.dataset.fecha; state.modo = 'dia'; render(); window.scrollTo(0, 0); },
  'slot': (el, e) => {
    const r = el.getBoundingClientRect(), step = Number(data.negocio.intervalo) || 30;
    let m = Number(el.dataset.start) + (e.clientY - r.top) / PX; m = Math.floor(m / step) * step;
    openCitaForm({}, { fecha: el.dataset.fecha, hora: fromMin(Math.max(0, Math.min(23 * 60 + 45, m))) });
  },
  'mes': el => { let { y, m } = state.mes; m += Number(el.dataset.d); if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; } state.mes = { y, m }; const st = $('#stats'); if (st) st.outerHTML = tarjetaStats(); },
  'ver-cliente': el => openCliente(el.dataset.key),
  'cita-para': el => { const x = clientes().find(k => k.key === el.dataset.key); if (x) openCitaForm({}, { cliente: x.nombre, telefono: fmtTel(x.telefono), fecha: today() }); },
  'logo-subir': () => $('#logoFile').click(),
  'logo-quitar': () => { data.negocio.logo = ''; save(); actualizarIconos(); render(); toast('Logo quitado'); },
  'svc-nuevo': () => { data.servicios.push({ id: uid(), nombre:'Nuevo servicio', duracion:30, precio:0, color: COLORS[data.servicios.length % COLORS.length] }); save(); render(); const rows = $$('.svc-row[data-svc] input[data-f="nombre"]'); const last = rows[rows.length - 1]; if (last){ last.focus(); last.select(); } },
  'svc-borrar': async el => { const s = getSvc(el.dataset.id); if (!s) return; if (!await confirmDialog('¿Borrar servicio?', `“${s.nombre}” ya no aparecerá al agendar. Las citas anteriores no cambian.`, { ok:'Borrar', danger:true })) return; data.servicios = data.servicios.filter(x => x.id !== s.id); save(); render(); },
  'svc-sugeridos': async () => { if (!await confirmDialog('¿Cargar servicios sugeridos?', 'Se agregarán los servicios típicos de tu tipo de negocio. Luego puedes editarlos o borrarlos.', { ok:'Agregar' })) return; const nombres = new Set(data.servicios.map(s => s.nombre.toLowerCase())); serviciosDePreset(data.negocio.tipo).forEach(s => { if (!nombres.has(s.nombre.toLowerCase())) data.servicios.push(s); }); save(); render(); toast('Servicios agregados ✓'); },
  'tpl-var': el => { const ta = $('#tpl_' + el.dataset.tpl); if (!ta) return; const ins = '{' + el.dataset.var + '}'; const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a; ta.value = ta.value.slice(0, a) + ins + ta.value.slice(b); ta.focus(); ta.selectionStart = ta.selectionEnd = a + ins.length; data.plantillas[el.dataset.tpl] = ta.value; save(); },
  'tpl-preview': el => { const t = el.dataset.tpl; openSheet({ title: 'Vista previa · ' + TIPOS[t].label, body: `<p class="small muted" style="margin-top:0">Así lo verá tu cliente en WhatsApp (con datos de ejemplo):</p><div class="wa-bg"><div class="preview">${esc(fillTpl(data.plantillas[t], citaEjemplo()))}</div></div>`, footer: '<button class="btn primary" data-action="close-sheet">Listo</button>' }); },
  'tpl-reset': async el => { const t = el.dataset.tpl; if (!await confirmDialog('¿Restaurar mensaje original?', 'Se perderán los cambios que hiciste a este mensaje.', { ok:'Restaurar' })) return; data.plantillas[t] = DEFAULT_TPL[t]; save(); render(); },
  'tpl-ia': el => openMejorarIA(el.dataset.tpl),
  'ia-borrar': async () => { if (!await confirmDialog('¿Borrar la llave?', 'El Motor Inteligente se apagará. Tu agenda sigue funcionando igual.', { ok:'Borrar', danger:true })) return; localStorage.removeItem(LS_IA_KEY); closeSheet(); render(); toast('Llave borrada de este teléfono'); },
  'instalar': async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; render(); },
  'exportar-json': () => { descargar(nombreArchivo('json'), respaldoJSON(), 'application/json'); toast('Respaldo descargado ✓ Guárdalo en tu WhatsApp, correo o Drive.', { ms:4500 }); },
  'exportar-csv': () => { descargar(nombreArchivo('csv'), citasCSV(), 'text/csv;charset=utf-8'); toast('Archivo para Excel descargado ✓'); },
  'compartir-respaldo': async () => {
    const file = new File([respaldoJSON()], nombreArchivo('json'), { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){ try { await navigator.share({ files:[file], title:'Respaldo de mi agenda' }); } catch (e) {} }
    else { descargar(file.name, file); toast('Tu teléfono no permite compartir archivos; se descargó el respaldo.'); }
  },
  'importar': () => $('#importFile').click(),
  'limpiar': async () => {
    if (!await confirmDialog('¿Borrar todos los datos?', 'Se borrarán negocio, servicios, citas y clientes de este teléfono. Haz un respaldo antes si lo necesitas.', { ok:'Borrar todo', danger:true, escribir:'BORRAR' })) return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_IA_KEY);
    data = defaultData(); state.view = 'hoy'; actualizarIconos(); render(); window.scrollTo(0, 0); toast('Datos borrados. Empecemos de nuevo.');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  if (el.dataset.action === 'slot' && e.target.closest('.blk')) return;
  if (el.tagName === 'A' && el.dataset.action !== 'wa-sent') e.preventDefault();
  fn(el, e);
});

/* ---------- Campos de formulario en Ajustes y Onboarding ---------- */
let tplTimer;
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-bind]')){
    const path = t.dataset.bind.split('.');
    let val = t.type === 'checkbox' ? t.checked : t.value.trim();
    if (t.dataset.num) val = Number(val) || 0;
    if (t.dataset.valid === 'tel' && val && !validPhone(val)){ t.closest('.field').classList.add('invalid'); return; }
    if (t.closest('.field')) t.closest('.field').classList.remove('invalid');
    if (path.join('.') === 'ajustes.tasaBase') val = Math.min(90, Math.max(0, val));
    if (path.join('.') === 'ajustes.pais') val = digits(val) || '52';
    let o = data; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = val;
    if (save()) toast('Guardado ✓', { ms:1400 });
    if (path[1] === 'nombre'){ renderHeader(); actualizarIconos(); }
    if (path[1] === 'tipo') render();
    return;
  }
  const svcRow = t.closest('.svc-row[data-svc]');
  if (svcRow){
    const s = getSvc(svcRow.dataset.svc); if (!s) return;
    const f = t.dataset.f;
    if (f === 'nombre'){ if (!t.value.trim()){ t.value = s.nombre; toast('El servicio necesita un nombre', { type:'err' }); return; } s.nombre = t.value.trim(); }
    if (f === 'duracion'){ const v = Math.round(Number(t.value)); if (!(v >= 5 && v <= 720)){ t.value = s.duracion; toast('Duración entre 5 y 720 minutos', { type:'err' }); return; } s.duracion = v; }
    if (f === 'precio'){ const v = Number(t.value); if (!(v >= 0)){ t.value = s.precio; toast('Precio no válido', { type:'err' }); return; } s.precio = v; }
    if (f === 'color') s.color = t.value;
    if (save()) toast('Guardado ✓', { ms:1400 });
    return;
  }
  const hRow = t.closest('.hor-row[data-dia]');
  if (hRow){
    const h = data.negocio.horario[hRow.dataset.dia], f = t.dataset.f;
    if (f === 'abierto'){ h.abierto = t.checked; $$('input[type=time]', hRow).forEach(i => i.disabled = !t.checked); }
    else {
      const nuevo = { ...h, [f]: t.value };
      if (!t.value || toMin(nuevo.inicio) >= toMin(nuevo.fin)){ t.value = h[f]; toast('La hora de cierre debe ser después de la de apertura', { type:'err' }); return; }
      h[f] = t.value;
    }
    if (save()) toast('Guardado ✓', { ms:1400 });
    return;
  }
  if (t.id === 'jumpDate' && t.value){ state.fecha = t.value; render(); return; }
  if (t.id === 'importFile' && t.files[0]){ importarArchivo(t.files[0]); t.value = ''; return; }
  if (t.id === 'logoFile' && t.files[0]){ procesarLogo(t.files[0]); t.value = ''; return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea[data-tpl]')){ data.plantillas[t.dataset.tpl] = t.value; clearTimeout(tplTimer); tplTimer = setTimeout(save, 400); return; }
  if (t.id === 'buscarCliente'){ state.buscar = t.value; const pos = t.selectionStart; render(); const n = $('#buscarCliente'); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'onbForm') return;
  e.preventDefault();
  const nombre = $('#onbNombre').value.trim(), tel = $('#onbTel').value.trim();
  $('#onbNombre').closest('.field').classList.toggle('invalid', nombre.length < 2);
  $('#onbTel').closest('.field').classList.toggle('invalid', !validPhone(tel));
  if (nombre.length < 2 || !validPhone(tel)){ toast('Revisa los campos marcados en rojo', { type:'err' }); return; }
  const tipo = state.onbTipo || 'unas';
  Object.assign(data.negocio, { nombre, telefono: tel, tipo });
  data.servicios = serviciosDePreset(tipo);
  data.configurado = true; data.demo = false;
  save(); actualizarIconos(); state.view = 'hoy'; render(); window.scrollTo(0, 0);
  toast('¡Listo! Ya puedes agendar tu primera cita.', { ms:4000 });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#dialogRoot').classList.contains('open')) return; if (sheetOpen()) closeSheet(); } });
window.addEventListener('afterprint', () => document.body.classList.remove('print-mode'));
window.addEventListener('storage', e => { if (e.key === LS_KEY){ load(); render(); } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (data.ajustes.tema === 'auto') applyTheme(); });

/* ---------- Refresco automático (cada minuto) ---------- */
function refrescoSuave(){
  if (document.hidden || sheetOpen() || !data.configurado) return;
  if (!['hoy', 'agenda'].includes(state.view)) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
setInterval(refrescoSuave, 60000);
document.addEventListener('visibilitychange', refrescoSuave);

/* ---------- Inicio ---------- */
load();
render();
actualizarIconos();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  // Opcional: si junto a index.html existe sw.js, la app abre aunque no haya internet.
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__agenda = { get data(){ return data; }, state, mensaje, waLink, pendientes, statsMes, citasCSV, respaldoJSON, ticketBytes, ticketHTML, llamarIA };
})();
</script>
