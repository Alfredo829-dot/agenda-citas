<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Citas</title>
<meta name="description" content="Agenda de citas con recordatorios por WhatsApp y tickets. Funciona sin internet, tus datos se quedan en tu teléfono.">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<style>
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#f2effa; --surface-3:#e9e5f6;
  --text:#1c1630; --muted:#6b6585; --border:#e6e2f3;
  --accent:#7c3aed; --accent-2:#db2777; --accent-soft:#efe7ff; --accent-text:#5b21b6;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#b45309; --warn-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2;
  --wa:#1fa855; --wa-dark:#128c4b;
  --shadow:0 1px 2px rgba(28,22,48,.05),0 6px 20px rgba(28,22,48,.06);
  --shadow-lg:0 12px 40px rgba(28,22,48,.18);
  --radius:16px; --radius-sm:11px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --grad:linear-gradient(135deg,#7c3aed 0%,#c026d3 55%,#db2777 100%);
  --nav-h:64px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0e0c15; --surface:#181524; --surface-2:#211d31; --surface-3:#2b2640;
  --text:#f4f1ff; --muted:#a59fbe; --border:#2e2943;
  --accent:#a78bfa; --accent-2:#f472b6; --accent-soft:#2a2244; --accent-text:#c4b5fd;
  --ok:#34d399; --ok-soft:#0f3a2c; --warn:#fbbf24; --warn-soft:#3a2d0c; --danger:#f87171; --danger-soft:#3d1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:38px;height:38px;border-radius:12px;background:var(--grad);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.brand-logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.brand-name{font-weight:750;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:6px;flex:none}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--surface)}
.icon-btn .dot.on{background:#22c55e}

/* ---------- Navigation ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:23px;height:23px}
.tab.active{color:var(--accent)}
.tab.active::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-2);color:#fff;font-size:11px;display:grid;place-items:center}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));z-index:29;border:0;border-radius:18px;height:54px;padding:0 20px 0 16px;
  background:var(--grad);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(192,38,211,.38);cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.96)}
.fab svg{width:22px;height:22px}
@media (min-width:900px){
  .tabs{top:61px;bottom:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;padding:14px 10px;gap:4px;border-top:0;border-right:1px solid var(--border);background:var(--bg)}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:14.5px}
  .tab.active{background:var(--accent-soft);color:var(--accent-text)}
  .tab.active::before{display:none}
  .tab .badge{position:static;margin-left:auto}
  main{margin-left:220px;padding:24px 28px 60px;max-width:none}
  .fab{bottom:24px;right:28px}
  .brand-name{max-width:40vw}
}

/* ---------- Cards & UI ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title h2{font-size:16.5px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-title .count{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text);padding:2px 8px;border-radius:999px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:899px){.grid-2{grid-template-columns:1fr}}
.hero{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.hero .sub{opacity:.88;font-size:13.5px;margin-top:2px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 10px}
.hero-stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.hero-stat span{font-size:11.5px;opacity:.9}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;
  padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .12s,background .2s,box-shadow .2s;white-space:nowrap;min-height:42px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--grad);color:#fff;border:0;box-shadow:0 6px 16px rgba(124,58,237,.28)}
.btn.wa{background:var(--wa);color:#fff;border:0}
.btn.wa:hover{background:var(--wa-dark)}
.btn.wa.sent{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.btn.danger.solid{background:var(--danger);color:#fff;border:0}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--border))}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.accent{background:var(--accent-soft);color:var(--accent-text)}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--border);cursor:pointer}
.item:first-child{border-top:0}
.item .time{flex:none;width:58px;font-weight:750;font-size:14px;letter-spacing:-.01em}
.item .time small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.item .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.item .main{flex:1;min-width:0}
.item .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:750;color:#fff;flex:none;font-size:15px}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}

.rem{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.rem:first-child{border-top:0}
.rem .main{flex:1;min-width:0;cursor:pointer}
.rem.later{opacity:.72}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.label{font-size:13px;font-weight:650;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;min-height:46px}
textarea.input{min-height:120px;resize:vertical;line-height:1.45;font-size:15px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field.invalid .input{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 16%,transparent)}
.field .err{display:none;color:var(--danger);font-size:12.5px;font-weight:600}
.field.invalid .err{display:block}
.field .hint{font-size:12px;color:var(--muted)}
.fields-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.slots{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.slot{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:650;cursor:pointer}
.slot.on{background:var(--accent);border-color:var(--accent);color:#fff}
.warnbox{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-bottom:10px}
.warnbox.danger{background:var(--danger-soft);color:var(--danger)}
.infobox{border-radius:12px;padding:11px 13px;font-size:13.5px;background:var(--accent-soft);color:var(--accent-text);margin-bottom:12px}
.var-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.var-chips button{border:1px dashed var(--border);background:var(--surface-2);border-radius:8px;padding:3px 8px;font-size:12px;font-family:var(--mono);cursor:pointer;color:var(--accent-text)}
.preview{white-space:pre-wrap;background:#e7ffdb;color:#111b21;border-radius:12px 12px 12px 4px;padding:10px 12px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08);max-width:92%}
[data-theme="dark"] .preview{background:#005c4b;color:#e9edef}
.wa-bg{background:#efeae2;border-radius:14px;padding:12px}
[data-theme="dark"] .wa-bg{background:#0b141a}
details>summary{cursor:pointer;font-weight:650;color:var(--accent);list-style:none;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
.svc-row{display:grid;grid-template-columns:32px minmax(0,1fr) 64px 76px 36px;gap:6px;align-items:center;margin-bottom:8px}
.svc-row .input{padding:9px 8px;min-height:40px;font-size:15px}
.svc-row input[type=color]{width:32px;height:32px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer}
.svc-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.svc-row input[type=color]::-webkit-color-swatch{border:2px solid var(--border);border-radius:50%}
.hor-row{display:grid;grid-template-columns:82px 28px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.hor-row .input{padding:8px;min-height:40px;font-size:15px}
.hor-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}

/* ---------- Agenda ---------- */
.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .icon-btn{width:38px;height:38px}
.date-title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.timeline-wrap{position:relative;padding-left:52px}
.timeline{position:relative;cursor:copy}
.timeline .hr{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
.timeline .hr.half{border-top-style:dashed;opacity:.6}
.timeline .hr span{position:absolute;left:-52px;top:-9px;width:46px;text-align:right;font-size:11.5px;color:var(--muted);font-weight:600}
.timeline .shade{position:absolute;left:0;right:0;background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--muted) 10%,transparent) 6px 12px);pointer-events:none}
.timeline .now{position:absolute;left:-6px;right:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}
.timeline .now::before{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.blk{position:absolute;border-radius:10px;padding:5px 8px;overflow:hidden;cursor:pointer;z-index:2;font-size:12.5px;line-height:1.25;
  border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .12s}
.blk:active{transform:scale(.98)}
.blk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.falta{opacity:.55;text-decoration:line-through}
.blk.atendida{opacity:.7}
.blk .ic{position:absolute;right:6px;top:5px;font-size:11px}
.week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.wday{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;min-height:180px;scroll-snap-align:start}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.wday.closed{background:var(--surface-2)}
.wday-h{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;margin-bottom:6px}
.wday-h b{font-size:13px;text-transform:capitalize}
.wday-h span{font-size:20px;font-weight:800}
.wchip{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:8px;padding:5px 7px;margin-bottom:5px;font-size:12px;cursor:pointer;line-height:1.25}
.wchip b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip.falta{opacity:.5;text-decoration:line-through}
.wadd{width:100%;border:1px dashed var(--border);background:none;border-radius:8px;padding:5px;color:var(--muted);cursor:pointer;font-size:12px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface-2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.big{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 18%,var(--surface)),var(--surface-2))}
.stat.big b{color:var(--ok);font-size:26px}
.meter{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:8px;background:var(--grad)}

/* ---------- Sheet / dialog ---------- */
#sheetRoot,#dialogRoot{position:fixed;inset:0;z-index:50;display:none}
#dialogRoot{z-index:60}
#sheetRoot.open,#dialogRoot.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,6,24,.5);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet-handle{width:42px;height:5px;border-radius:5px;background:var(--surface-3);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 18px}
.sheet-head h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sheet-body{overflow-y:auto;padding:6px 18px 16px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.sheet-foot .btn{flex:1}
@media (min-width:700px){
  .sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;border-radius:22px;animation:pop .2s}
  .sheet.wide{width:min(760px,94vw)}
  .sheet-handle{display:none}
  .sheet-head{padding-top:16px}
}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow-lg);animation:pop .18s}
.dialog h3{font-size:17px;margin-bottom:8px}
.dialog p{margin:0 0 14px;color:var(--muted)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}to{opacity:1}}
@keyframes fade{from{opacity:0}}
.detail-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.info{background:var(--surface-2);border-radius:12px;padding:9px 11px}
.info span{display:block;font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.03em}
.info b{font-size:14.5px}
.info.full{grid-column:1/-1}
.section-label{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.wa-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.wa-row:first-of-type{border-top:0}
.wa-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none;font-size:16px}
.wa-ic.done{background:var(--ok-soft);color:var(--ok)}

/* ---------- Toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;gap:8px;width:min(440px,92vw);pointer-events:none}
.toast{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1c1630;color:#fff;padding:12px 14px;border-radius:14px;box-shadow:var(--shadow-lg);font-weight:600;font-size:14px;
  opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s;pointer-events:auto}
[data-theme="dark"] .toast{background:#f4f1ff;color:#1c1630}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--danger);color:#fff}
.toast button{border:0;background:rgba(255,255,255,.18);color:inherit;font-weight:750;padding:6px 10px;border-radius:9px;cursor:pointer}
[data-theme="dark"] .toast button{background:rgba(0,0,0,.08)}
@media (min-width:900px){#toasts{bottom:28px}}
body.noscroll #toasts{bottom:auto;top:calc(12px + env(safe-area-inset-top))}

/* ---------- Onboarding ---------- */
.onb{max-width:520px;margin:10px auto}
.onb-hero{text-align:center;padding:18px 8px 6px}
.onb-hero .logo{width:76px;height:76px;border-radius:24px;margin:0 auto 14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 14px 30px rgba(124,58,237,.35)}
.onb-hero .logo svg{width:40px;height:40px;color:#fff}
.onb-hero h1{font-size:25px;font-weight:850;letter-spacing:-.03em}
.onb-hero p{color:var(--muted);margin:8px 0 0}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.type{border:1.5px solid var(--border);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;text-align:left;font-weight:700;display:flex;align-items:center;gap:8px}
.type span{font-size:22px}
.type.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.feat div{font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 10px;font-weight:600}
.logo-prev{width:64px;height:64px;border-radius:16px;border:1px dashed var(--border);display:grid;place-items:center;overflow:hidden;background:var(--surface-2);flex:none}
.logo-prev img{width:100%;height:100%;object-fit:contain;background:#fff}
.key-wrap{position:relative}
.key-wrap .input{padding-right:52px;font-family:var(--mono);font-size:14px}
.key-wrap button{position:absolute;right:6px;top:6px;height:34px;border:0;background:var(--surface-2);border-radius:9px;padding:0 9px;cursor:pointer;font-size:12px;font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 12px}
.steps li{counter-increment:s;position:relative;padding:4px 0 8px 36px;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body.print-mode>*:not(#printArea){display:none!important}
  body.print-mode #printArea{display:block!important}
  body.print-mode{background:#fff!important;color:#000!important}
  .tk{width:48mm;margin:0 auto;padding:2mm 0;font-family:var(--mono);font-size:9.5pt;line-height:1.3;color:#000}
  .tk .c{text-align:center}
  .tk .t{font-size:13pt;font-weight:800}
  .tk .r{display:flex;justify-content:space-between;gap:4px}
  .tk .r span:last-child{text-align:right}
  .tk hr{border:0;border-top:1px dashed #000;margin:2mm 0}
  .tk img{max-width:30mm;max-height:20mm;display:block;margin:0 auto 1mm;filter:grayscale(1)}
  .dayprint{font-family:var(--font);color:#000;font-size:11pt}
  .dayprint h1{font-size:16pt;margin-bottom:4pt}
  .dayprint table{width:100%;border-collapse:collapse;margin-top:8pt}
  .dayprint th,.dayprint td{border-bottom:1px solid #999;padding:5pt 4pt;text-align:left;vertical-align:top}
}
</style>

<script>
(function(){
'use strict';

/* =========================================================
   Agenda de Citas · App de un solo archivo
   Datos: solo en este dispositivo (localStorage). Sin servidores.
   ========================================================= */

const LS_KEY = 'agendaCitas.v1';
const LS_IA_KEY = 'agendaCitas.llaveMotor'; // la llave nunca entra al respaldo
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const COLORS = ['#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6','#a855f7','#f97316','#6366f1'];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const ORDEN_DIAS = [1,2,3,4,5,6,0];

const PRESETS = {
  unas:        { etiqueta:'Uñas',        emoji:'💅', servicios:[['Manicure gelish',60,250],['Uñas acrílicas (set)',120,450],['Retoque acrílico',90,300],['Pedicure spa',60,300],['Retiro de gel',30,100]] },
  barberia:    { etiqueta:'Barbería',    emoji:'💈', servicios:[['Corte de cabello',40,150],['Corte + barba',60,220],['Arreglo de barba',30,100],['Corte niño',30,120],['Diseño / freestyle',45,180]] },
  estetica:    { etiqueta:'Estética',    emoji:'✨', servicios:[['Corte dama',60,250],['Tinte completo',120,800],['Mechas / balayage',180,1500],['Peinado',60,350],['Planchado de ceja',30,150]] },
  consultorio: { etiqueta:'Consultorio', emoji:'🩺', servicios:[['Consulta general',30,400],['Primera consulta',45,500],['Seguimiento',20,300],['Limpieza dental',45,600],['Sesión de terapia',50,500]] }
};

const TIPOS = {
  confirmacion: { label:'Confirmación', corto:'Confirmar', icono:'📩' },
  r24:          { label:'Recordatorio 24 h', corto:'24 h antes', icono:'📅' },
  r2:           { label:'Recordatorio del día', corto:'2 h antes', icono:'⏰' }
};

const DEFAULT_TPL = {
  confirmacion:
`¡Hola {cliente}! 👋 Tu cita en {negocio} quedó agendada:

✨ {servicio}
📅 {fecha}
🕐 {hora}
{anticipo}

Si necesitas cambiarla, avísanos por aquí con tiempo. ¡Te esperamos!`,
  r24:
`Hola {cliente} 😊 Te recordamos tu cita de mañana en {negocio}:

✨ {servicio}
📅 {fecha} a las {hora}

¿Nos confirmas tu asistencia? Responde SÍ para confirmar, o avísanos si necesitas cambiar la hora. ¡Gracias!`,
  r2:
`¡Hola {cliente}! ⏰ Hoy a las {hora} te esperamos en {negocio} para tu {servicio}.
{direccion}
Si se te complica llegar, avísanos por aquí. ¡Nos vemos pronto!`
};

const VARS = ['cliente','negocio','servicio','fecha','hora','precio','anticipo','direccion','telefono_negocio','folio'];

const IA_PROV = {
  gemini: { nombre:'Google Gemini', modelo:'gemini-2.5-flash-lite', link:'https://aistudio.google.com/app/apikey', boton:'Create API key', nota:'Tiene nivel gratuito para empezar.' },
  groq:   { nombre:'Groq',          modelo:'openai/gpt-oss-20b',    link:'https://console.groq.com/keys',         boton:'Create API Key', nota:'Muy rápido; cobra por uso muy bajo.' }
};

function defaultHorario(){
  const h = {};
  for (let d = 0; d < 7; d++) h[d] = { abierto: d !== 0, inicio: '10:00', fin: d === 6 ? '18:00' : '20:00' };
  return h;
}
function defaultData(){
  return {
    version: 1, configurado: false, folio: 0, demo: false,
    negocio: { nombre:'', telefono:'', direccion:'', logo:'', tipo:'unas', intervalo:30, horario: defaultHorario() },
    servicios: [], citas: [],
    plantillas: { ...DEFAULT_TPL },
    ajustes: { tema:'auto', pais:'52', tasaBase:20, quitarAcentos:false, logoTicket:true, modoLento:false, mensajeTicket:'¡Gracias por tu preferencia!', impresora:'' },
    ia: { proveedor:'gemini', modelo:'' }
  };
}
function serviciosDePreset(tipo){
  return (PRESETS[tipo] || PRESETS.unas).servicios.map((s, i) => ({ id: uid() + i, nombre: s[0], duracion: s[1], precio: s[2], color: COLORS[i % COLORS.length] }));
}

/* ---------- Persistencia ---------- */
function deepMerge(base, extra){
  if (Array.isArray(base)) return Array.isArray(extra) ? extra : base;
  if (base && typeof base === 'object'){
    const out = { ...base };
    if (extra && typeof extra === 'object') for (const k of Object.keys(extra)) out[k] = (k in base) ? deepMerge(base[k], extra[k]) : extra[k];
    return out;
  }
  return extra === undefined ? base : extra;
}
function normalizar(obj){
  const d = deepMerge(defaultData(), obj || {});
  d.citas = (d.citas || []).filter(c => c && c.id && /^\d{4}-\d{2}-\d{2}$/.test(c.fecha) && /^\d{2}:\d{2}$/.test(c.hora))
    .map(c => ({ recordatorios:{}, estado:'pendiente', notas:'', anticipo:false, anticipoMonto:0, duracion:30, precio:0, ...c, recordatorios: { ...(c.recordatorios || {}) } }));
  d.servicios = (d.servicios || []).filter(s => s && s.id);
  for (let i = 0; i < 7; i++) if (!d.negocio.horario[i]) d.negocio.horario[i] = defaultHorario()[i];
  return d;
}
let data;
function load(){
  try { data = normalizar(JSON.parse(localStorage.getItem(LS_KEY) || 'null')); }
  catch (e) { data = defaultData(); }
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); return true; }
  catch (e) { toast('No se pudo guardar: la memoria del navegador está llena. Usa un logo más ligero o exporta y limpia datos viejos.', { type:'err', ms:6000 }); return false; }
}

/* ---------- Fechas y formatos ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const toMin = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + (b || 0); };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function citaStart(c){ const d = parseYmd(c.fecha); const m = toMin(c.hora); d.setHours(Math.floor(m / 60), m % 60, 0, 0); return d; }
function citaEnd(c){ return new Date(citaStart(c).getTime() + (Number(c.duracion) || 30) * 60000); }
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmtFecha = s => new Intl.DateTimeFormat('es-MX', { weekday:'long', day:'numeric', month:'long' }).format(parseYmd(s));
const fmtFechaCorta = s => new Intl.DateTimeFormat('es-MX', { weekday:'short', day:'numeric', month:'short' }).format(parseYmd(s));
const fmtFechaTicket = s => { const d = parseYmd(s); return `${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
function fmtHora(h){ const m = typeof h === 'number' ? h : toMin(h); let H = Math.floor(m / 60); const M = m % 60; const ap = H >= 12 ? 'p. m.' : 'a. m.'; H = H % 12 || 12; return `${H}:${pad(M)} ${ap}`; }
function fmtRango(h, dur){ const a = toMin(h), b = Math.min(24 * 60 - 1, a + (Number(dur) || 30)); const fa = fmtHora(a), fb = fmtHora(b); return (a >= 720) === (b >= 720) ? fa.replace(/ [ap]\. m\./, '') + ' – ' + fb : fa + ' – ' + fb; }
function fmtHoraCorta(m){ let H = Math.floor(m / 60); const ap = H >= 12 ? 'pm' : 'am'; H = H % 12 || 12; return m % 60 ? `${H}:${pad(m % 60)}` : `${H} ${ap}`; }
const money = n => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmtTs = ts => new Intl.DateTimeFormat('es-MX', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }).format(new Date(ts));
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- Teléfonos y WhatsApp ---------- */
const digits = s => String(s || '').replace(/\D/g, '');
const phoneKey = t => digits(t).slice(-10);
const validPhone = t => { const d = digits(t); return d.length >= 10 && d.length <= 15; };
function waNumber(tel){
  let d = digits(tel);
  const cc = digits(data.ajustes.pais) || '52';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 10) d = cc + d;
  if (d.length === 13 && d.startsWith('521')) d = '52' + d.slice(3); // formato viejo de celulares MX
  return d;
}
function fmtTel(t){ const d = phoneKey(t); return d.length === 10 ? `${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}` : t; }
const waLink = (tel, text) => `https://wa.me/${waNumber(tel)}` + (text ? `?text=${encodeURIComponent(text)}` : '');
const firstName = s => cap(String(s || '').trim().split(/\s+/)[0] || '');

function fillTpl(tpl, c){
  const n = data.negocio;
  const v = {
    cliente: firstName(c.cliente), cliente_completo: c.cliente, negocio: n.nombre || 'nuestro negocio',
    servicio: c.servicioNombre || '', fecha: fmtFecha(c.fecha), hora: fmtHora(c.hora), precio: money(c.precio),
    direccion: n.direccion ? '📍 ' + n.direccion : '', telefono_negocio: n.telefono ? fmtTel(n.telefono) : '',
    anticipo: c.anticipo ? `✅ Anticipo recibido: ${money(c.anticipoMonto)}` : '', folio: c.folio ? '#' + c.folio : ''
  };
  return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m))
    .split('\n').map(l => l.trimEnd()).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
const mensaje = (c, tipo) => fillTpl(data.plantillas[tipo] || DEFAULT_TPL[tipo], c);

/* ---------- Consultas ---------- */
const activa = c => c.estado === 'pendiente' || c.estado === 'confirmada';
const getCita = id => data.citas.find(c => c.id === id);
const getSvc = id => data.servicios.find(s => s.id === id);
const colorDe = c => (getSvc(c.servicioId) || {}).color || '#8b5cf6';
const citasDe = f => data.citas.filter(c => c.fecha === f).sort((a, b) => toMin(a.hora) - toMin(b.hora));
const horarioDe = f => data.negocio.horario[parseYmd(f).getDay()] || { abierto:false, inicio:'10:00', fin:'20:00' };
const tieneRecordatorio = c => { const r = c.recordatorios || {}; return !!(r.confirmacion || r.r24 || r.r2); };

function pendientes(){
  const now = new Date(), hoy = today(), manana = addDays(hoy, 1), out = [];
  for (const c of data.citas){
    if (!activa(c)) continue;
    const st = citaStart(c); if (st <= now) continue;
    const r = c.recordatorios || {};
    const hrs = (st - now) / 36e5;
    if (c.fecha === hoy){ if (!r.r2) out.push({ c, tipo:'r2', later: hrs > 3, desde: fromMin(Math.max(0, toMin(c.hora) - 120)) }); }
    else if (c.fecha === manana){ if (!r.r24) out.push({ c, tipo:'r24', later: false }); }
    else if (!r.confirmacion) out.push({ c, tipo:'confirmacion', later: false });
  }
  return out.sort((a, b) => (Number(a.later) - Number(b.later)) || (citaStart(a.c) - citaStart(b.c)));
}
function porCerrar(){
  const now = new Date(), limite = addDays(today(), -21);
  return data.citas.filter(c => activa(c) && c.fecha >= limite && citaEnd(c) < now).sort((a, b) => citaStart(a) - citaStart(b));
}
function clientes(){
  const map = new Map();
  for (const c of data.citas){
    const k = phoneKey(c.telefono); if (!k) continue;
    let x = map.get(k);
    if (!x){ x = { key:k, nombre:c.cliente, telefono:c.telefono, citas:[], faltas:0, atendidas:0, canceladas:0, gastado:0, ultima:'' }; map.set(k, x); }
    x.citas.push(c);
    if (c.estado === 'falta') x.faltas++;
    if (c.estado === 'cancelada') x.canceladas++;
    if (c.estado === 'atendida'){ x.atendidas++; x.gastado += Number(c.precio) || 0; }
    if (c.fecha >= x.ultima){ x.ultima = c.fecha; x.nombre = c.cliente; x.telefono = c.telefono; }
  }
  return [...map.values()];
}
const clienteDe = tel => clientes().find(x => x.key === phoneKey(tel));
function statsMes(y, m){
  const pref = `${y}-${pad(m + 1)}`;
  const cs = data.citas.filter(c => c.fecha.startsWith(pref) && c.estado !== 'cancelada');
  const faltas = cs.filter(c => c.estado === 'falta');
  const atend = cs.filter(c => c.estado === 'atendida');
  const cerradas = faltas.length + atend.length;
  const pct = cerradas ? faltas.length / cerradas * 100 : 0;
  const ingresos = atend.reduce((s, c) => s + (Number(c.precio) || 0), 0);
  const conRec = atend.filter(tieneRecordatorio);
  const tasa = Math.min(90, Math.max(0, Number(data.ajustes.tasaBase) || 0)) / 100;
  const salvadas = conRec.length * tasa;
  const recDinero = conRec.reduce((s, c) => s + (Number(c.precio) || 0), 0) * tasa;
  const anticiposFaltas = faltas.reduce((s, c) => s + (c.anticipo ? Number(c.anticipoMonto) || 0 : 0), 0);
  const enviados = cs.reduce((s, c) => s + Object.values(c.recordatorios || {}).filter(Boolean).length, 0);
  return { total: cs.length, faltas: faltas.length, atendidas: atend.length, cerradas, pct, ingresos, salvadas, recDinero, anticiposFaltas, recuperado: Math.round(recDinero + anticiposFaltas), enviados, tasa };
}

function toast(msg, { type = 'ok', action, onAction, ms = 3200 } = {}){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { onAction && onAction(); el.remove(); };
  $('#toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, ms);
}
function confirmDialog(titulo, texto, { ok = 'Aceptar', cancel = 'Cancelar', danger = false, escribir = '' } = {}){
  return new Promise(resolve => {
    const root = $('#dialogRoot');
    root.innerHTML = `<div class="backdrop"></div><div class="dialog" role="alertdialog" aria-modal="true">
      <h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      ${escribir ? `<div class="field"><label for="dlgInput">Escribe <b>${esc(escribir)}</b> para confirmar</label><input class="input" id="dlgInput" autocomplete="off"></div>` : ''}
      <div class="btn-row"><button class="btn" data-r="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-r="1">${esc(ok)}</button></div></div>`;
    root.classList.add('open');
    const fin = v => { root.classList.remove('open'); root.innerHTML = ''; resolve(v); };
    root.querySelector('.backdrop').onclick = () => fin(false);
    root.querySelector('[data-r="0"]').onclick = () => fin(false);
    root.querySelector('[data-r="1"]').onclick = () => {
      if (escribir){ const v = $('#dlgInput').value.trim().toUpperCase(); if (v !== escribir){ $('#dlgInput').closest('.field').classList.add('invalid'); toast('Escribe la palabra exacta para confirmar', { type:'err' }); return; } }
      fin(true);
    };
    const inp = $('#dlgInput'); if (inp) inp.focus();
  });
}

const PX = 1.4; // px por minuto
function vistaAgenda(){
  const f = state.fecha, dia = state.modo === 'dia';

  if (dia) titulo = fmtFecha(f);
  else { const s = semanaInicio(f), e = addDays(s, 6); const ds = parseYmd(s), de = parseYmd(e); titulo = ds.getMonth() === de.getMonth() ? `${ds.getDate()} – ${de.getDate()} de ${MESES[de.getMonth()]}` : `${ds.getDate()} ${MESES[ds.getMonth()].slice(0,3)} – ${de.getDate()} ${MESES[de.getMonth()].slice(0,3)}`; }

  const h = horarioDe(f);
  return `

    </div>
  </div>
  <div class="date-title">${esc(cap(titulo))}</div>
  ${dia ? `<div class="row between" style="margin-bottom:12px"><div class="small muted">${h.abierto ? `Abierto ${fmtHora(h.inicio)} – ${fmtHora(h.fin)}` : 'Cerrado este día'} · ${cs.length} cita${cs.length === 1 ? '' : 's'} · ${money(cs.filter(c => c.estado !== 'falta').reduce((s, c) => s + (+c.precio || 0), 0))}</div>
    <button class="btn sm" data-action="imprimir-dia">🖨️ Imprimir día</button></div>
    <div class="card" style="padding:14px 12px 14px 8px"><div class="timeline-wrap">${timeline(f, cs)}</div></div>
    <p class="tiny muted" style="text-align:center">Toca un espacio libre para agendar a esa hora.</p>
    ${canceladas.length ? `<div class="card"><div class="card-title"><h2 class="small">Canceladas (${canceladas.length})</h2></div><div class="list">${canceladas.map(filaCita).join('')}</div></div>` : ''}`
  : vistaSemana(f)}`;
}
const semanaInicio = f => addDays(f, -((parseYmd(f).getDay() + 6) % 7));
function lanes(cs){
  const items = cs.map(c => ({ c, s: toMin(c.hora), e: toMin(c.hora) + (Number(c.duracion) || 30) })).sort((a, b) => a.s - b.s || a.e - b.e);
  const out = []; let group = [], end = -1;
  const flush = () => { const ends = []; group.forEach(it => { let i = ends.findIndex(x => x <= it.s); if (i < 0){ i = ends.length; ends.push(it.e); } else ends[i] = it.e; it.lane = i; }); group.forEach(it => { it.lanes = ends.length; out.push(it); }); group = []; };
  items.forEach(it => { if (group.length && it.s >= end){ flush(); end = -1; } group.push(it); end = Math.max(end, it.e); });
  if (group.length) flush();
  return out;
}
function timeline(f, cs){
  const h = horarioDe(f);
  let s = h.abierto ? toMin(h.inicio) : 9 * 60, e = h.abierto ? toMin(h.fin) : 20 * 60;
  cs.forEach(c => { s = Math.min(s, toMin(c.hora)); e = Math.max(e, toMin(c.hora) + (Number(c.duracion) || 30)); });
  s = Math.floor(s / 60) * 60; e = Math.min(24 * 60, Math.ceil(e / 60) * 60);
  let html = '';
  for (let m = s; m <= e; m += 30) html += `<div class="hr ${m % 60 ? 'half' : ''}" style="top:${(m - s) * PX}px">${m % 60 ? '' : `<span>${fmtHoraCorta(m)}</span>`}</div>`;
  if (h.abierto){
    const a = toMin(h.inicio), b = toMin(h.fin);
    if (a > s) html += `<div class="shade" style="top:0;height:${(a - s) * PX}px"></div>`;
    if (b < e) html += `<div class="shade" style="top:${(b - s) * PX}px;height:${(e - b) * PX}px"></div>`;
  } else html += `<div class="shade" style="top:0;height:${(e - s) * PX}px"></div>`;
  const conocidos = new Map(clientes().map(x => [x.key, x]));
  lanes(cs).forEach(it => {
    const c = it.c, w = 100 / it.lanes, hgt = Math.max(26, (it.e - it.s) * PX - 3);
    const cl = conocidos.get(phoneKey(c.telefono));
    const ic = [c.anticipo ? '💰' : '', tieneRecordatorio(c) ? '📲' : '', cl && cl.faltas ? '⚠️' : ''].join('');
    html += `<div class="blk ${c.estado}" data-action="ver-cita" data-id="${c.id}" style="--c:${colorDe(c)};top:${(it.s - s) * PX + 1}px;height:${hgt}px;left:calc(${w * it.lane}% + 2px);width:calc(${w}% - 4px)">
      ${ic ? `<span class="ic">${ic}</span>` : ''}<b>${esc(fmtHora(c.hora))} · ${esc(c.cliente)}</b>${hgt > 40 ? `<div class="m">${esc(c.servicioNombre)} · ${money(c.precio)}</div>` : ''}</div>`;
  });
  if (f === today()){ const nm = nowMin(); if (nm >= s && nm <= e) html += `<div class="now" style="top:${(nm - s) * PX}px"></div>`; }
  return `<div class="timeline" id="timeline" data-action="slot" data-start="${s}" data-fecha="${f}" style="height:${(e - s) * PX}px">${html}</div>`;
}
function scrollTimeline(){
  const tl = $('#timeline'); if (!tl || state.fecha !== today()) return;
  const nm = nowMin(), s = Number(tl.dataset.start);
  const y = tl.getBoundingClientRect().top + window.scrollY + (nm - s) * PX - 180;
  if (y > 0) window.scrollTo({ top: y });
}
function vistaSemana(f){
  const s0 = semanaInicio(f), hoy = today();
  let html = '<div class="week">';
  for (let i = 0; i < 7; i++){
    const d = addDays(s0, i), dt = parseYmd(d), h = horarioDe(d);
    const cs = citasDe(d).filter(c => c.estado !== 'cancelada');
    html += `<div class="wday ${d === hoy ? 'today' : ''} ${h.abierto ? '' : 'closed'}">
      <div class="wday-h" data-action="ir-dia" data-fecha="${d}"><b>${DIAS[dt.getDay()].slice(0, 3)}</b><span>${dt.getDate()}</span></div>
      ${cs.map(c => `<div class="wchip ${c.estado}" style="--c:${colorDe(c)}" data-action="ver-cita" data-id="${c.id}"><b>${esc(fmtHora(c.hora))}</b>${esc(c.cliente)}</div>`).join('')}
      ${!h.abierto && !cs.length ? '<div class="tiny muted" style="margin-bottom:6px">Cerrado</div>' : ''}
      <button class="wadd" data-action="nueva-cita" data-fecha="${d}">+ Cita</button>
    </div>`;
  }
  return html + '</div><p class="tiny muted">Desliza para ver toda la semana. Toca el día para verlo completo.</p>';
}

function vistaClientes(){
  const q = state.buscar.trim().toLowerCase();
  let list = clientes().sort((a, b) => b.ultima.localeCompare(a.ultima));

const ICON_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';

function slotsLibres(fecha, dur, exceptId){
  const h = horarioDe(fecha); if (!h.abierto) return [];
  const step = Number(data.negocio.intervalo) || 30;
  const ocup = data.citas.filter(c => c.fecha === fecha && c.id !== exceptId && c.estado !== 'cancelada' && c.estado !== 'falta').map(c => [toMin(c.hora), toMin(c.hora) + (+c.duracion || 30)]);
  const out = [], ini = toMin(h.inicio), fin = toMin(h.fin), lim = fecha === today() ? nowMin() : -1;
  for (let m = ini; m + dur <= fin; m += step){ if (m <= lim) continue; if (ocup.some(([a, b]) => m < b && m + dur > a)) continue; out.push(fromMin(m)); }
  return out;
}

function openCitaForm(c = {}, preset = {}){

  const svc = getSvc(v.servicioId);
  if (v.duracion === '' && svc) v.duracion = svc.duracion;
  if (v.precio === '' && svc) v.precio = svc.precio;
  const known = clientes();
  const body = `<form id="citaForm" novalidate autocomplete="off">
    <div id="citaWarn"></div>
    <div class="field"><label for="fTel">WhatsApp del cliente</label><input class="input" id="fTel" type="tel" inputmode="tel" value="${esc(v.telefono)}" placeholder="10 dígitos, ej. 775 123 4567"><span class="err">Escribe un número de WhatsApp válido (10 dígitos)</span></div>
    <div class="field"><label for="fCliente">Nombre</label><input class="input" id="fCliente" list="dlClientes" value="${esc(v.cliente)}" placeholder="Nombre de la clienta o cliente" maxlength="60" autocapitalize="words"><span class="err">Escribe el nombre</span>
      <datalist id="dlClientes">${known.map(x => `<option value="${esc(x.nombre)}">${esc(fmtTel(x.telefono))}</option>`).join('')}</datalist></div>
    <div class="field"><label for="fSvc">Servicio</label><select class="input" id="fSvc">${data.servicios.map(s => `<option value="${s.id}" ${s.id === v.servicioId ? 'selected' : ''}>${esc(s.nombre)} · ${s.duracion} min · ${money(s.precio)}</option>`).join('')}${v.servicioId && !getSvc(v.servicioId) ? `<option value="${esc(v.servicioId)}" selected>${esc(v.servicioNombre)}</option>` : ''}</select><span class="err">Elige un servicio</span></div>
    <div class="fields-2">
      <div class="field"><label for="fFecha">Fecha</label><input class="input" id="fFecha" type="date" value="${esc(v.fecha)}"><span class="err">Elige la fecha</span></div>
      <div class="field"><label for="fHora">Hora</label><input class="input" id="fHora" type="time" step="300" value="${esc(v.hora)}"><span class="err">Elige la hora</span></div>
    </div>
    <div class="label" style="margin:-4px 0 6px">Horarios libres</div>
    <div class="slots" id="slotChips"></div>
    <div class="fields-2" style="margin-top:6px">
      <div class="field"><label for="fDur">Duración (min)</label><input class="input" id="fDur" type="number" min="5" step="5" inputmode="numeric" value="${esc(v.duracion)}"><span class="err">Mínimo 5 minutos</span></div>
      <div class="field"><label for="fPrecio">Precio $</label><input class="input" id="fPrecio" type="number" min="0" step="10" inputmode="decimal" value="${esc(v.precio)}"><span class="err">Precio no válido</span></div>
    </div>
    <label class="switch"><span><b>💰 Anticipo pagado</b><br><span class="small muted">Ayuda a que no falten</span></span><input type="checkbox" id="fAnt" ${v.anticipo ? 'checked' : ''}></label>
    <div class="field ${v.anticipo ? '' : 'hidden'}" id="fAntBox"><label for="fAntM">Monto del anticipo $</label><input class="input" id="fAntM" type="number" min="0" step="10" inputmode="decimal" value="${esc(v.anticipoMonto || '')}"><span class="err">Escribe el monto (puede ser mayor a 0 y no más que el precio)</span></div>
    <div class="field"><label for="fNotas">Notas (opcional)</label><textarea class="input" id="fNotas" style="min-height:70px" maxlength="300" placeholder="Ej. diseño francés, alergia a…">${esc(v.notas)}</textarea></div>
    ${editing ? `<div class="field"><label for="fEstado">Estado</label><select class="input" id="fEstado">${[['pendiente','Pendiente'],['confirmada','Confirmada'],['atendida','Atendida (llegó)'],['falta','Faltó'],['cancelada','Cancelada']].map(([k, l]) => `<option value="${k}" ${v.estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
  </form>`;
  const footer = `${editing ? `<button class="btn danger" data-action="cita-borrar" data-id="${c.id}" style="flex:0 0 auto">🗑️</button>` : ''}<button class="btn" data-action="close-sheet">Cancelar</button><button class="btn primary" id="btnGuardarCita" style="flex:2">${editing ? 'Guardar cambios' : 'Guardar cita'}</button>`;
  openSheet({ title: editing ? 'Editar cita' : 'Nueva cita', body, footer, onMount: sh => {
    const f = id => $('#' + id, sh);
    const refresh = () => {
      const dur = Number(f('fDur').value) || 30, fecha = f('fFecha').value, hora = f('fHora').value;
      const libres = fecha ? slotsLibres(fecha, dur, c.id) : [];

        : `<span class="small muted">${fecha && !horarioDe(fecha).abierto ? 'Este día está marcado como cerrado (puedes agendar igual eligiendo la hora).' : 'No hay horarios libres; elige la hora manualmente.'}</span>`;
      const w = [];
      const cl = clienteDe(f('fTel').value);
      if (cl && validPhone(f('fTel').value)){
        if (cl.faltas) w.push(`<div class="warnbox danger">⚠️ ${esc(cl.nombre)} ha faltado ${cl.faltas} ${cl.faltas === 1 ? 'vez' : 'veces'}. Considera pedir anticipo.</div>`);
        else w.push(`<div class="infobox">⭐ Cliente frecuente: ${cl.atendidas} cita${cl.atendidas === 1 ? '' : 's'} atendida${cl.atendidas === 1 ? '' : 's'}, nunca ha faltado.</div>`);
      }
      if (fecha && hora){
        const s = toMin(hora), e = s + dur;
        const choque = data.citas.find(x => x.id !== c.id && x.fecha === fecha && activa(x) && s < toMin(x.hora) + (+x.duracion || 30) && e > toMin(x.hora));
        if (choque) w.push(`<div class="warnbox">⏱️ Se empalma con ${esc(choque.cliente)} (${esc(fmtHora(choque.hora))}). Puedes guardarla igual si atienden dos personas.</div>`);
        const h = horarioDe(fecha);
        if (h.abierto && (s < toMin(h.inicio) || e > toMin(h.fin))) w.push(`<div class="warnbox">🕐 Queda fuera de tu horario (${esc(fmtHora(h.inicio))} – ${esc(fmtHora(h.fin))}).</div>`);
        if (!editing && citaStart({ fecha, hora }) < new Date()) w.push(`<div class="warnbox">📅 Esa fecha y hora ya pasaron.</div>`);
      }
      f('citaWarn').innerHTML = w.join('');
    };
    f('fSvc').addEventListener('change', () => { const s = getSvc(f('fSvc').value); if (s){ f('fDur').value = s.duracion; f('fPrecio').value = s.precio; } refresh(); });
    ['fFecha', 'fHora', 'fDur'].forEach(id => f(id).addEventListener('change', refresh));
    f('fTel').addEventListener('input', () => {
      const cl = clienteDe(f('fTel').value);
      if (cl && validPhone(f('fTel').value) && !f('fCliente').value.trim()) f('fCliente').value = cl.nombre;
      refresh();
    });
    f('fCliente').addEventListener('change', () => {
      const x = known.find(k => k.nombre.toLowerCase() === f('fCliente').value.trim().toLowerCase());
      if (x && !f('fTel').value.trim()){ f('fTel').value = fmtTel(x.telefono); refresh(); }
    });

function guardarCita(orig){
  const sh = $('#sheetRoot');
  const g = id => $('#' + id, sh);
  const val = {
    telefono: g('fTel').value.trim(), cliente: g('fCliente').value.trim().replace(/\s+/g, ' '), servicioId: g('fSvc').value,
    fecha: g('fFecha').value, hora: g('fHora').value, duracion: Number(g('fDur').value), precio: g('fPrecio').value === '' ? NaN : Number(g('fPrecio').value),
    anticipo: g('fAnt').checked, anticipoMonto: Number(g('fAntM').value) || 0, notas: g('fNotas').value.trim(),
    estado: g('fEstado') ? g('fEstado').value : (orig.estado || 'pendiente')
  };
  const bad = [];
  const mark = (id, ok) => { g(id).closest('.field').classList.toggle('invalid', !ok); if (!ok) bad.push(id); };
  mark('fTel', validPhone(val.telefono));
  mark('fCliente', val.cliente.length >= 2);
  mark('fSvc', !!val.servicioId);
  mark('fFecha', /^\d{4}-\d{2}-\d{2}$/.test(val.fecha));
  mark('fHora', /^\d{2}:\d{2}$/.test(val.hora));
  mark('fDur', val.duracion >= 5 && val.duracion <= 720);
  mark('fPrecio', Number.isFinite(val.precio) && val.precio >= 0);
  if (val.anticipo) mark('fAntM', val.anticipoMonto > 0 && (!Number.isFinite(val.precio) || val.anticipoMonto <= val.precio || val.precio === 0));
  if (bad.length){ g(bad[0]).focus(); toast('Revisa los campos marcados en rojo', { type:'err' }); return; }
  const svc = getSvc(val.servicioId);
  const editing = !!orig.id;
  const cambioHorario = editing && (orig.fecha !== val.fecha || orig.hora !== val.hora);
  const rec = {
    ...orig, ...val, id: orig.id || uid(), servicioNombre: svc ? svc.nombre : (orig.servicioNombre || 'Servicio'),
    anticipoMonto: val.anticipo ? val.anticipoMonto : 0,
    recordatorios: cambioHorario ? {} : { ...(orig.recordatorios || {}) },
    folio: orig.folio || nextFolio(), creada: orig.creada || Date.now(), actualizada: Date.now()
  };
  if (editing) data.citas = data.citas.map(x => x.id === rec.id ? rec : x); else data.citas.push(rec);
  if (!save()) return;
  closeSheet();
  state.fecha = rec.fecha;
  render();
  if (cambioHorario) toast('Cita reagendada. Vuelve a enviar la confirmación con la nueva hora.', { ms:4500 });
  else toast(editing ? 'Cambios guardados' : 'Cita guardada ✓');
  openCitaDetalle(rec.id, !editing || cambioHorario);
}

/* =========================================================
   IMPRESORA TÉRMICA (Web Bluetooth + ESC/POS) y window.print()
   ========================================================= */
const BT_PAIRS = [
  ['000018f0-0000-1000-8000-00805f9b34fb', '00002af1-0000-1000-8000-00805f9b34fb'], // genéricas 58 mm (MTP-II, PT-210, GOOJPRT…)
  ['e7810a71-73ae-499d-8c15-faa9aef0c3f2', 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f'], // otras genéricas chinas
  ['49535343-fe7d-4ae5-8fa9-9fafd205e455', '49535343-8841-43f4-a8d4-ecbe34729bb3'], // módulos ISSC / Microchip
  ['0000ff00-0000-1000-8000-00805f9b34fb', '0000ff02-0000-1000-8000-00805f9b34fb'],
  ['0000ffe0-0000-1000-8000-00805f9b34fb', '0000ffe1-0000-1000-8000-00805f9b34fb'],
  ['0000fee7-0000-1000-8000-00805f9b34fb', '0000fec7-0000-1000-8000-00805f9b34fb']
];
const BT_SERVICES = BT_PAIRS.map(p => p[0]);
const bt = { device: null, char: null };
const TW = 32; // caracteres por renglón en 58 mm

async function btBuscarCaracteristica(server){
  for (const [s, c] of BT_PAIRS){
    try { const svc = await server.getPrimaryService(s); return await svc.getCharacteristic(c); } catch (e) { /* probar el siguiente */ }
  }
  try {
    const svcs = await server.getPrimaryServices();
    for (const svc of svcs){
      const chs = await svc.getCharacteristics();
      const w = chs.find(x => x.properties.writeWithoutResponse || x.properties.write);
      if (w) return w;
    }
  } catch (e) {}
  return null;
}
async function btConectar(todos){
  if (!navigator.bluetooth) throw new Error('Este navegador no permite Bluetooth. Usa Chrome en Android o computadora, o la opción “Imprimir / PDF”.');
  const opts = todos ? { acceptAllDevices: true, optionalServices: BT_SERVICES }
    : { filters: BT_SERVICES.map(s => ({ services: [s] })).concat(['MTP', 'PT-', 'PT2', 'Printer', 'BlueTooth Printer', 'RPP', 'MPT', 'POS', 'GOOJPRT', 'XP-', 'BT-', 'M58', 'P58', 'Q'].map(namePrefix => ({ namePrefix }))), optionalServices: BT_SERVICES };
  const device = await navigator.bluetooth.requestDevice(opts);
  device.addEventListener('gattserverdisconnected', () => { bt.char = null; actualizarEstadoBT(); });
  const server = await device.gatt.connect();
  const ch = await btBuscarCaracteristica(server);
  if (!ch){ try { device.gatt.disconnect(); } catch (e) {} throw new Error('Se conectó, pero esa impresora no acepta impresión por este medio. Prueba con “Buscar todos” o usa “Imprimir / PDF”.'); }
  bt.device = device; bt.char = ch;
  data.ajustes.impresora = device.name || 'Impresora'; save();
  actualizarEstadoBT();
}
async function btAsegurar(){
  if (bt.char && bt.device && bt.device.gatt.connected) return;
  if (bt.device){
    try { const server = await bt.device.gatt.connect(); bt.char = await btBuscarCaracteristica(server); if (bt.char) return; } catch (e) {}
  }
  await btConectar(false);
}
async function btEscribir(bytes){
  await btAsegurar();
  const lento = !!data.ajustes.modoLento, size = lento ? 20 : 100;
  const sinResp = bt.char.properties.writeWithoutResponse && bt.char.writeValueWithoutResponse;
  for (let i = 0; i < bytes.length; i += size){
    const part = bytes.slice(i, i + size);
    if (sinResp) await bt.char.writeValueWithoutResponse(part);
    else if (bt.char.writeValueWithResponse) await bt.char.writeValueWithResponse(part);
    else await bt.char.writeValue(part);
    await sleep(lento ? 45 : 12);
  }
}
function actualizarEstadoBT(){
  const el = $('#btStatus'); if (!el) return;
  el.className = 'chip ' + (bt.char ? 'ok' : '');
  el.textContent = bt.char ? 'Conectada: ' + (bt.device && bt.device.name || 'impresora') : 'Sin conectar';
}
function btErrorAmigable(e){
  const m = String(e && e.message || e);
  if (/cancel|chooser|User cancelled|NotFoundError/i.test(m) || (e && e.name === 'NotFoundError')) return 'No se eligió ninguna impresora. Si no aparece en la lista, prueba con “Buscar todos”.';
  if (e && e.name === 'SecurityError') return 'El navegador bloqueó Bluetooth. Abre la app desde un enlace https en Chrome.';
  if (/GATT|disconnected|NetworkError/i.test(m)) return 'Se perdió la conexión con la impresora. Acércala, revisa que esté encendida y vuelve a intentar.';
  return m;
}

/* --- Codificación de texto para impresoras (página de códigos PC850) --- */
const CP850 = { 'Ç':0x80,'ü':0x81,'é':0x82,'â':0x83,'ä':0x84,'à':0x85,'å':0x86,'ç':0x87,'ê':0x88,'ë':0x89,'è':0x8A,'ï':0x8B,'î':0x8C,'ì':0x8D,'Ä':0x8E,'Å':0x8F,'É':0x90,'ô':0x93,'ö':0x94,'ò':0x95,'û':0x96,'ù':0x97,'Ö':0x99,'Ü':0x9A,
  'á':0xA0,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'ª':0xA6,'º':0xA7,'¿':0xA8,'¡':0xAD,'Á':0xB5,'Â':0xB6,'À':0xB7,'Ê':0xD2,'Ë':0xD3,'È':0xD4,'Í':0xD6,'Î':0xD7,'Ï':0xD8,'Ó':0xE0,'Ô':0xE2,'Ò':0xE3,'Ú':0xE9,'Û':0xEA,'Ù':0xEB,'°':0xF8,'·':0xFA };
function textoTicket(s){
  let t = String(s ?? '').normalize('NFC').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...');
  if (data.ajustes.quitarAcentos) t = t.replace(/[¿¡]/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return t.replace(/[^\x0A\x20-\x7E\u00A0-\u00FF]/g, '').replace(/\s+$/g, '');
}
function encode850(s){ const out = []; for (const ch of s){ const c = ch.charCodeAt(0); if (c === 10 || (c >= 32 && c < 127)) out.push(c); else out.push(CP850[ch] || 0x3F); } return out; }
function wrapTxt(s, w = TW){
  const out = [];
  String(s).split('\n').forEach(par => {
    let line = '';
    par.split(/\s+/).filter(Boolean).forEach(word => {
      while (word.length > w){ if (line){ out.push(line); line = ''; } out.push(word.slice(0, w)); word = word.slice(w); }
      if (!line) line = word; else if ((line + ' ' + word).length <= w) line += ' ' + word; else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}
function filaTk(l, r){ l = String(l); r = String(r); const sp = TW - l.length - r.length; return sp >= 1 ? l + ' '.repeat(sp) + r : null; }

class Esc {
  constructor(){ this.b = []; }
  raw(arr){ for (const x of arr) this.b.push(x); return this; }
  init(){ return this.raw([0x1B, 0x40, 0x1B, 0x74, 0x02]); } // ESC @ ; ESC t 2 = PC850
  align(n){ return this.raw([0x1B, 0x61, n]); }
  bold(on){ return this.raw([0x1B, 0x45, on ? 1 : 0]); }
  size(w, h){ return this.raw([0x1D, 0x21, ((w - 1) << 4) | (h - 1)]); }
  line(s = ''){ return this.raw(encode850(textoTicket(s) + '\n')); }
  par(s, w){ wrapTxt(textoTicket(s), w).forEach(l => this.line(l)); return this; }
  kv(k, v){ const t = textoTicket(v), f = filaTk(k, t); if (f) return this.line(f); this.line(k); return this.par(t); }
  feed(n){ return this.raw([0x1B, 0x64, n]); }
  cut(){ return this.raw([0x1D, 0x56, 0x42, 0x00]); }
  bytes(){ return new Uint8Array(this.b); }
}
function cargarImg(src){ return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; }); }
async function logoRaster(src, maxW = 256){
  const img = await cargarImg(src);
  let w = Math.min(maxW, img.width); w = Math.max(8, Math.floor(w / 8) * 8);
  let h = Math.round(img.height * w / img.width);
  if (h > 160){ h = 160; w = Math.max(8, Math.floor(img.width * h / img.height / 8) * 8); }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  const px = x.getImageData(0, 0, w, h).data, bw = w / 8, out = [0x1D, 0x76, 0x30, 0x00, bw & 255, bw >> 8, h & 255, h >> 8];
  for (let y = 0; y < h; y++) for (let b = 0; b < bw; b++){
    let byte = 0;
    for (let k = 0; k < 8; k++){ const i = (y * w + b * 8 + k) * 4; const lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; if (lum < 140) byte |= 0x80 >> k; }
    out.push(byte);
  }
  return out;
}
async function ticketBytes(c){

  return e.bytes();
}

const GEMINI_RESPALDO = ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite'];
async function llamarIA(prompt, o = {}){
  const prov = o.prov || data.ia.proveedor || 'gemini';
  const propio = (o.modelo !== undefined ? o.modelo : data.ia.modelo || '').trim();
  // Si el cliente no eligió modelo y Google retira el recomendado, se prueba con los de respaldo.
  const lista = propio ? [propio] : (prov === 'gemini' ? [IA_PROV.gemini.modelo, ...GEMINI_RESPALDO] : [IA_PROV[prov].modelo]);
  let ultimo;
  for (const m of lista){
    try { return await llamarIAModelo(prompt, { ...o, prov, modelo: m }); }
    catch (e) { ultimo = e; if (!e.modeloNoDisponible) throw e; }
  }
  throw ultimo;
}
async function llamarIAModelo(prompt, o){
  const key = o.key || iaKey(), prov = o.prov, modelo = o.modelo;
  if (!key) throw new Error('Primero pega tu llave de activación.');
  let res;
  try {
    if (prov === 'gemini'){
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:generateContent`, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents:[{ role:'user', parts:[{ text: prompt }] }], generationConfig:{ temperature: 0.8, maxOutputTokens: 600 } })
      });
    } else {
      const body = { model: modelo, messages:[{ role:'user', content: prompt }], temperature: 0.8, max_completion_tokens: 900 };
      if (/gpt-oss/i.test(modelo)) body.reasoning_effort = 'low';
      res = await fetch('https://api.groq.com/openai/v1/chat/completions', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key }, body: JSON.stringify(body) });
    }
  } catch (e) {
    throw new Error(navigator.onLine === false ? 'Sin internet. El Motor Inteligente necesita conexión; todo lo demás funciona sin internet.' : 'No se pudo conectar con el proveedor. Revisa tu internet e inténtalo de nuevo.');
  }
  if (!res.ok){
    let msg = ''; try { const j = await res.json(); msg = (j.error && (j.error.message || j.error)) || ''; } catch (e) {}
    if (res.status === 401 || res.status === 403 || (res.status === 400 && /api.?key|key not valid|invalid/i.test(msg))) throw new Error('La llave no es válida o no tiene permiso. Cópiala de nuevo completa.');
    if (res.status === 429) throw new Error('Llegaste al límite de uso por ahora. Espera unos minutos e intenta de nuevo.');
    if (res.status === 404){ const err = new Error(`El modelo “${modelo}” no está disponible. Revisa el nombre en Opciones avanzadas o déjalo vacío.`); err.modeloNoDisponible = true; throw err; }
    throw new Error(`El proveedor respondió con un error (${res.status}). ${String(msg).slice(0, 140)}`);
  }
  const j = await res.json();
  const txt = prov === 'gemini'
    ? (((j.candidates || [])[0] || {}).content || { parts: [] }).parts.map(p => p.text || '').join('')
    : (((j.choices || [])[0] || {}).message || {}).content || '';
  if (!String(txt).trim()) throw new Error('El proveedor no regresó texto. Intenta de nuevo.');
  return String(txt).trim().replace(/^```\w*\n?|```$/g, '').replace(/^["“]+|["”]+$/g, '').trim();
}

function dibujarIcono(size, logo){
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const x = cv.getContext('2d'), s = size;
  const g = x.createLinearGradient(0, 0, s, s); g.addColorStop(0, '#7c3aed'); g.addColorStop(.55, '#c026d3'); g.addColorStop(1, '#db2777');
  x.fillStyle = g; rrect(x, 0, 0, s, s, s * .22); x.fill();
  if (logo){
    x.fillStyle = '#fff'; rrect(x, s * .12, s * .12, s * .76, s * .76, s * .16); x.fill();
    const k = Math.min(s * .64 / logo.width, s * .64 / logo.height), w = logo.width * k, h = logo.height * k;
    x.drawImage(logo, (s - w) / 2, (s - h) / 2, w, h);
  } else {
    x.fillStyle = '#fff'; rrect(x, s * .2, s * .26, s * .6, s * .54, s * .08); x.fill();
    x.fillRect(s * .31, s * .17, s * .07, s * .16); x.fillRect(s * .62, s * .17, s * .07, s * .16);
    x.fillStyle = '#e9d5ff'; x.fillRect(s * .2, s * .37, s * .6, s * .035);
    x.strokeStyle = '#7c3aed'; x.lineWidth = s * .065; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(s * .36, s * .58); x.lineTo(s * .46, s * .68); x.lineTo(s * .65, s * .48); x.stroke();
  }
  return cv.toDataURL('image/png');
}
